<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    De hele site in één icoon: crème papier, de rode kantlijn, één blauwe regel,
    en daarop het einde van een zin. Op zestien pixels is echte tekst onleesbaar,
    dus staat er geen letter maar wat een letter achterlaat: een haal inkt en de
    punt erachter. Dat is ook precies wat de site is, één zin die afloopt.
  -->
  <rect width="64" height="64" rx="9" fill="#FBF7EF"/>
  <rect width="64" height="64" rx="9" fill="none" stroke="#22241D" stroke-width="3"/>

  <line x1="16" y1="3" x2="16" y2="61" stroke="#D99A92" stroke-width="2"/>
  <line x1="3" y1="44" x2="61" y2="44" stroke="#B9CDE0" stroke-width="2.5"/>

  <path d="M22 41.5 C 27 37.5, 31 44, 36 40.5"
        fill="none" stroke="#22241D" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="47" cy="41" r="3.6" fill="#22241D"/>
</svg>
